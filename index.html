<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Recetario - Le Chique</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .tab-active { border-bottom: 2px solid #ef4444; color: #ef4444; font-weight: bold; }
    .tab-inactive { color: #6b7280; }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #ef4444; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: none; margin: auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
    
    <!-- NUEVO: 3 Pestañas en lugar de 2 -->
    <div class="flex border-b">
      <button id="tab-visor" onclick="cambiarPestaña('visor')" class="flex-1 py-4 text-center tab-active transition">📖 Visor de Recetas</button>
      <button id="tab-lista" onclick="cambiarPestaña('lista')" class="flex-1 py-4 text-center tab-inactive transition">📋 Lista de Recetas</button>
      <button id="tab-editor" onclick="cambiarPestaña('editor')" class="flex-1 py-4 text-center tab-inactive transition">✏️ Editor de Recetas</button>
    </div>

    <!-- PESTAÑA 1: VISOR -->
    <div id="vista-visor" class="p-6">
      <div id="controles-impresion" class="bg-gray-50 p-4 rounded-lg mb-6 flex flex-col md:flex-row gap-4 items-center justify-between border">
        <div class="w-full md:w-1/2">
          <label class="block text-sm font-bold text-gray-700 mb-1">Seleccionar Receta</label>
          <select id="selector-receta" onchange="cargarRecetaSeleccionada()" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-red-500 outline-none">
            <option value="">Conectando a base de datos...</option>
          </select>
        </div>
        <div class="w-full md:w-1/4">
          <label class="block text-sm font-bold text-gray-700 mb-1">Pax Deseado</label>
          <input type="number" id="input-pax" oninput="recalcularPax()" value="1" min="1" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-red-500 outline-none">
        </div>
        <div class="w-full md:w-1/4 flex justify-end mt-4 md:mt-0">
          <button onclick="descargarPDF()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded shadow transition flex items-center gap-2 w-full justify-center">
            📄 Descargar PDF
          </button>
        </div>
      </div>

      <div id="zona-impresion" class="bg-white p-8">
        <div class="flex justify-between items-center border-b-2 border-gray-200 pb-4 mb-6">
          <img src="./assets/logo_lechique.png" alt="Le Chique" class="h-16 object-contain" onerror="this.src='https://placehold.co/150x60?text=Le+Chique'">
          <div class="text-center">
            <h1 id="titulo-receta" class="text-2xl md:text-3xl font-black text-gray-800 uppercase tracking-wider">Selecciona una receta</h1>
            <p class="text-gray-500 text-sm mt-1">Calculado para: <span id="display-pax" class="font-bold text-red-600 text-lg">0</span> Pax</p>
            <p class="text-xs text-gray-400 mt-1">Pax Base Original: <span id="display-pax-base">0</span></p>
          </div>
          <img src="./assets/logo_michelin.png" alt="Michelin" class="h-16 object-contain" onerror="this.src='https://placehold.co/80x80?text=Michelin'">
        </div>

        <div id="contenido-receta" class="hidden">
          <h2 class="text-xl font-bold text-gray-700 mb-3 border-b pb-1">Ingredientes</h2>
          <table class="w-full text-left mb-6 border-collapse">
            <thead>
              <tr class="bg-gray-100 text-gray-600 text-sm uppercase">
                <th class="p-3 border">Ingrediente</th>
                <th class="p-3 border w-32 text-right">Cantidad</th>
                <th class="p-3 border w-24">Unidad</th>
              </tr>
            </thead>
            <tbody id="tabla-ingredientes" class="text-gray-700"></tbody>
          </table>
          <h2 class="text-xl font-bold text-gray-700 mb-3 border-b pb-1">Procedimiento</h2>
          <div id="texto-procedimiento" class="text-gray-700 whitespace-pre-wrap leading-relaxed bg-gray-50 p-4 rounded-md border"></div>
        </div>
        
        <div class="mt-12 pt-4 border-t border-gray-200 flex justify-between items-center text-xs text-gray-400">
          <p>Documento generado automáticamente.</p>
          <div class="flex items-center gap-2">
            <span>Powered by:</span>
            <img src="./assets/mi_logo.png" alt="Mi Logo" class="h-8 object-contain rounded-full" onerror="this.src='https://placehold.co/40x40?text=Mi+Logo'">
          </div>
        </div>
      </div>
    </div>

    <!-- PESTAÑA 2: LISTA DE RECETAS -->
    <div id="vista-lista" class="p-6 hidden">
      <div class="bg-gray-50 p-6 rounded-lg border">
        <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">Administrar Recetas</h2>
        
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse bg-white rounded-md overflow-hidden shadow-sm">
            <thead class="bg-gray-100 text-gray-600 border-b">
              <tr>
                <th class="p-3 font-semibold">Nombre de la Receta</th>
                <th class="p-3 font-semibold text-center w-24">Pax Base</th>
                <th class="p-3 font-semibold text-center w-48">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-todas-recetas" class="text-gray-700">
              <!-- Se llena con JS -->
            </tbody>
          </table>
        </div>
        
      </div>
    </div>

    <!-- PESTAÑA 3: EDITOR -->
    <div id="vista-editor" class="p-6 hidden">
      <div class="bg-gray-50 p-6 rounded-lg border">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
          <h2 class="text-xl font-bold text-gray-800">Crear o Modificar Receta</h2>
          <select id="selector-editor" onchange="cargarEnEditor()" class="p-2 border rounded text-sm outline-none">
            <option value="">-- Crear Nueva Receta --</option>
          </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Nombre de la Receta</label>
            <input type="text" id="edit-nombre" placeholder="Ej: Esférico de Aceituna" class="w-full p-2 border rounded outline-none">
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Pax Base (Original)</label>
            <input type="number" id="edit-pax-base" value="4" min="1" class="w-full p-2 border rounded outline-none">
          </div>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-bold text-gray-700 mb-1">Ingredientes</label>
          <div id="contenedor-ingredientes-editor" class="space-y-2 mb-2"></div>
          <button onclick="agregarFilaIngrediente()" class="text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded shadow">+ Añadir otro ingrediente</button>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-bold text-gray-700 mb-1">Procedimiento</label>
          <textarea id="edit-procedimiento" rows="4" placeholder="1. Primer paso..." class="w-full p-2 border rounded outline-none"></textarea>
        </div>

        <div class="flex items-center gap-4 border-t pt-4 mt-4">
          <button onclick="guardarReceta()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded shadow transition">
            💾 Guardar en Firebase
          </button>
          <button onclick="limpiarEditor()" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-6 rounded shadow transition">
            Limpiar / Nueva
          </button>
          <div id="loader-guardar" class="loader"></div>
          <span id="mensaje-estado" class="text-sm font-bold"></span>
        </div>
      </div>
    </div>

  </div>

  <!-- SCRIPT DE FIREBASE -->
  <script type="module">
    // Importamos Firebase (Se añadió deleteDoc)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

    // Tu configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBJs05is5zZ25rteHveq0ubaXtX1Xw1K_8",
      authDomain: "recetario-le-chique.firebaseapp.com",
      projectId: "recetario-le-chique",
      storageBucket: "recetario-le-chique.firebasestorage.app",
      messagingSenderId: "78526035298",
      appId: "1:78526035298:web:5d52c7422190a47f1fe83b"
    };

    // Inicializar app y base de datos
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Variables globales
    window.recetasDB = []; 
    window.recetaActual = null;

    // --- OBTENER RECETAS DE FIREBASE ---
    window.obtenerRecetasDeFirebase = async () => {
      const selectVisor = document.getElementById('selector-receta');
      const selectEditor = document.getElementById('selector-editor');
      selectVisor.innerHTML = '<option value="">Descargando desde Firebase...</option>';
      
      try {
        const querySnapshot = await getDocs(collection(db, "recetas"));
        window.recetasDB = [];
        querySnapshot.forEach((documento) => {
          window.recetasDB.push(documento.data());
        });
        
        selectVisor.innerHTML = '<option value="">-- Selecciona una receta --</option>';
        selectEditor.innerHTML = '<option value="">-- Crear Nueva Receta --</option>';

        // Ordenar alfabéticamente
        window.recetasDB.sort((a, b) => a.nombre.localeCompare(b.nombre));

        window.recetasDB.forEach(receta => {
          selectVisor.innerHTML += `<option value="${receta.id}">${receta.nombre}</option>`;
          selectEditor.innerHTML += `<option value="${receta.id}">Editar: ${receta.nombre}</option>`;
        });

        // Actualizar la tabla de la nueva pestaña
        window.renderizarListaRecetas();

      } catch (error) {
        selectVisor.innerHTML = '<option value="">❌ Error al cargar. Revisa Firebase.</option>';
        console.error(error);
      }
    };

    // --- RENDERIZAR LA LISTA (NUEVA PESTAÑA) ---
    window.renderizarListaRecetas = () => {
      const tabla = document.getElementById('tabla-todas-recetas');
      tabla.innerHTML = '';
      
      if(window.recetasDB.length === 0) {
        tabla.innerHTML = '<tr><td colspan="3" class="p-6 text-center text-gray-500 italic">No hay recetas guardadas todavía. Ve al Editor para crear una.</td></tr>';
        return;
      }

      window.recetasDB.forEach(receta => {
        tabla.innerHTML += `
          <tr class="border-b hover:bg-gray-100 transition">
            <td class="p-3 font-medium text-gray-800">${receta.nombre}</td>
            <td class="p-3 text-center text-gray-600">${receta.pax_base}</td>
            <td class="p-3 flex justify-center gap-2">
              <button onclick="editarRecetaDesdeLista('${receta.id}')" class="bg-blue-100 text-blue-700 hover:bg-blue-200 font-semibold px-3 py-1 rounded text-sm transition shadow-sm">✏️ Editar</button>
              <button onclick="eliminarReceta('${receta.id}')" class="bg-red-100 text-red-700 hover:bg-red-200 font-semibold px-3 py-1 rounded text-sm transition shadow-sm">🗑️ Borrar</button>
            </td>
          </tr>
        `;
      });
    };

    // --- ACCIONES DE LA LISTA ---
    window.editarRecetaDesdeLista = (id) => {
      document.getElementById('selector-editor').value = id;
      window.cargarEnEditor();
      window.cambiarPestaña('editor');
    };

    window.eliminarReceta = async (id) => {
      const confirmacion = confirm("¿Estás seguro de que deseas eliminar esta receta? Esta acción no se puede deshacer.");
      if (!confirmacion) return;

      try {
        await deleteDoc(doc(db, "recetas", id));
        window.mostrarMensaje("🗑️ Receta eliminada", "text-red-600");
        
        // Recargar todo después de borrar
        await window.obtenerRecetasDeFirebase();
        
        // Si la receta borrada estaba en el visor o editor, limpiar
        if(window.recetaActual && window.recetaActual.id === id) {
          window.recetaActual = null;
          document.getElementById('contenido-receta').classList.add('hidden');
          document.getElementById('titulo-receta').innerText = "Selecciona una receta";
        }
        window.limpiarEditor();

      } catch (error) {
        alert("Error al eliminar la receta. Revisa la consola.");
        console.error("Error eliminando documento: ", error);
      }
    };

    // --- GUARDAR RECETA EN FIREBASE ---
    window.guardarReceta = async () => {
      const nombre = document.getElementById('edit-nombre').value.trim();
      const pax_base = parseInt(document.getElementById('edit-pax-base').value);
      const procedimiento = document.getElementById('edit-procedimiento').value.trim();
      
      if (!nombre || !pax_base || isNaN(pax_base)) {
        window.mostrarMensaje("Por favor, llena el nombre y el pax base.", "text-red-600");
        return;
      }

      const ingredientes = [];
      const filas = document.querySelectorAll('.fila-ingrediente');
      filas.forEach(fila => {
        const ingNombre = fila.querySelector('.ing-nombre').value.trim();
        const ingCant = parseFloat(fila.querySelector('.ing-cant').value);
        const ingUnidad = fila.querySelector('.ing-unidad').value.trim();
        if (ingNombre && !isNaN(ingCant)) {
          ingredientes.push({ nombre: ingNombre, cantidad: ingCant, unidad: ingUnidad });
        }
      });

      let id = document.getElementById('selector-editor').value;
      if (!id) {
        id = nombre.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
      }

      const datosGuardar = { id, nombre, pax_base, ingredientes, procedimiento };

      document.getElementById('loader-guardar').style.display = 'block';
      window.mostrarMensaje("Guardando en la nube...", "text-blue-600");

      try {
        await setDoc(doc(db, "recetas", id), datosGuardar);
        
        window.mostrarMensaje("✅ Receta guardada con éxito", "text-green-600");
        document.getElementById('loader-guardar').style.display = 'none';
        
        await window.obtenerRecetasDeFirebase();
        
        if(!document.getElementById('selector-editor').value) {
          window.limpiarEditor();
        }
      } catch (error) {
        window.mostrarMensaje("❌ Error al guardar. (Revisa reglas de Firebase)", "text-red-600");
        document.getElementById('loader-guardar').style.display = 'none';
        console.error(error);
      }
    };

    // --- FUNCIONES VISUALES ---
    window.cargarRecetaSeleccionada = () => {
      const idSeleccionado = document.getElementById('selector-receta').value;
      window.recetaActual = window.recetasDB.find(r => r.id === idSeleccionado);
      
      if (window.recetaActual) {
        document.getElementById('contenido-receta').classList.remove('hidden');
        document.getElementById('titulo-receta').innerText = window.recetaActual.nombre;
        document.getElementById('display-pax-base').innerText = window.recetaActual.pax_base;
        document.getElementById('input-pax').value = window.recetaActual.pax_base;
        document.getElementById('display-pax').innerText = window.recetaActual.pax_base;
        document.getElementById('texto-procedimiento').innerText = window.recetaActual.procedimiento;
        window.renderizarIngredientes(window.recetaActual.pax_base);
      } else {
        document.getElementById('contenido-receta').classList.add('hidden');
        document.getElementById('titulo-receta').innerText = "Selecciona una receta";
        document.getElementById('display-pax-base').innerText = "0";
        document.getElementById('display-pax').innerText = "0";
      }
    };

    window.recalcularPax = () => {
      if (!window.recetaActual) return;
      const paxDeseado = parseFloat(document.getElementById('input-pax').value) || 0;
      document.getElementById('display-pax').innerText = paxDeseado;
      window.renderizarIngredientes(paxDeseado);
    };

    window.renderizarIngredientes = (paxDeseado) => {
      const tabla = document.getElementById('tabla-ingredientes');
      tabla.innerHTML = '';
      const factor = paxDeseado / window.recetaActual.pax_base;
      window.recetaActual.ingredientes.forEach(ing => {
        const cantidadCalculada = (ing.cantidad * factor);
        const cantidadMostrada = cantidadCalculada % 1 === 0 ? cantidadCalculada : cantidadCalculada.toFixed(2);
        tabla.innerHTML += `
          <tr class="border-b hover:bg-gray-50">
            <td class="p-3">${ing.nombre}</td>
            <td class="p-3 text-right font-bold text-red-600">${cantidadMostrada}</td>
            <td class="p-3 text-gray-500">${ing.unidad}</td>
          </tr>
        `;
      });
    };

    window.descargarPDF = () => {
      if (!window.recetaActual) return alert("Selecciona una receta primero.");
      const elemento = document.getElementById('zona-impresion');
      const nombreArchivo = `${window.recetaActual.nombre.replace(/\s+/g, '_')}_${document.getElementById('display-pax').innerText}pax.pdf`;
      const opt = { margin: 0.5, filename: nombreArchivo, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' } };
      html2pdf().set(opt).from(elemento).save();
    };

    window.cambiarPestaña = (pestaña) => {
      // Ocultar todas las vistas y desactivar todos los botones
      ['visor', 'lista', 'editor'].forEach(p => {
        document.getElementById(`vista-${p}`).classList.add('hidden');
        document.getElementById(`tab-${p}`).className = "flex-1 py-4 text-center tab-inactive transition";
      });
      // Mostrar la seleccionada
      document.getElementById(`vista-${pestaña}`).classList.remove('hidden');
      document.getElementById(`tab-${pestaña}`).className = "flex-1 py-4 text-center tab-active transition";
    };

    window.agregarFilaIngrediente = (nombre = '', cant = '', unidad = '') => {
      const div = document.createElement('div');
      div.className = 'flex gap-2 fila-ingrediente items-center';
      div.innerHTML = `
        <input type="text" placeholder="Nombre" value="${nombre}" class="ing-nombre flex-1 p-2 border rounded outline-none">
        <input type="number" placeholder="Cant." value="${cant}" step="any" class="ing-cant w-24 p-2 border rounded outline-none">
        <input type="text" placeholder="Unid." value="${unidad}" class="ing-unidad w-24 p-2 border rounded outline-none">
        <button onclick="this.parentElement.remove()" class="text-red-500 font-bold px-2 hover:bg-red-100 rounded">X</button>
      `;
      document.getElementById('contenedor-ingredientes-editor').appendChild(div);
    };

    window.cargarEnEditor = () => {
      const idSeleccionado = document.getElementById('selector-editor').value;
      document.getElementById('contenedor-ingredientes-editor').innerHTML = ''; 
      if (idSeleccionado) {
        const recetaEdit = window.recetasDB.find(r => r.id === idSeleccionado);
        document.getElementById('edit-nombre').value = recetaEdit.nombre;
        document.getElementById('edit-pax-base').value = recetaEdit.pax_base;
        document.getElementById('edit-procedimiento').value = recetaEdit.procedimiento;
        recetaEdit.ingredientes.forEach(ing => window.agregarFilaIngrediente(ing.nombre, ing.cantidad, ing.unidad));
      } else {
        window.limpiarEditor();
      }
    };

    window.limpiarEditor = () => {
      document.getElementById('edit-nombre').value = '';
      document.getElementById('edit-pax-base').value = '4';
      document.getElementById('edit-procedimiento').value = '';
      document.getElementById('selector-editor').value = '';
      document.getElementById('contenedor-ingredientes-editor').innerHTML = '';
      window.agregarFilaIngrediente();
    };

    window.mostrarMensaje = (texto, claseColor) => {
      const span = document.getElementById('mensaje-estado');
      span.innerText = texto;
      span.className = `text-sm font-bold ${claseColor}`;
      setTimeout(() => { span.innerText = ""; }, 5000);
    };

    // Inicializar al cargar la página
    window.onload = () => {
      window.obtenerRecetasDeFirebase();
      window.agregarFilaIngrediente(); 
    };
  </script>
</body>
</html>
